# Rate limit zones. Must be in the http context, which is why this lives in
# conf.d/ (included by nginx.conf) rather than in the site file.

# General API traffic, per client IP. The API resolves straight to this box
# (not via Cloudflare), so $remote_addr is the real client.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Auth endpoints: tighter, to slow credential stuffing.
limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;

# Concurrent connections per IP.
limit_conn_zone $binary_remote_addr zone=conn:10m;

# nginx defaults to 503, which implies the server is broken. 429 is correct.
limit_req_status 429;
limit_conn_status 429;
