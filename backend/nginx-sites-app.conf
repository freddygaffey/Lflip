# AI auth server
server {
    listen 443 ssl;
    server_name ai.lflip.pebnum.com;
    ssl_certificate /etc/letsencrypt/live/ai.lflip.pebnum.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai.lflip.pebnum.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;


    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        # LLM calls are the most expensive endpoint here, so a smaller burst
        limit_req zone=api burst=20 nodelay;
        limit_conn conn 20;
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }

}

# HTTP -> HTTPS redirect for both
server {
    if ($host = ai.lflip.pebnum.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name  api.lflip.pebnum.com dev.lflip.pebnum.com ai.lflip.pebnum.com;
    return 301 https://$host$request_uri;


}
