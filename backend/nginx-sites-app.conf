server {
    listen 443 ssl;
    server_name api.lflip.pebnum.com;

    ssl_certificate /etc/letsencrypt/live/api.lflip.pebnum.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lflip.pebnum.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'" always;
    add_header X-Frame-Options "DENY" always;

    # exact matches are evaluated before the "location /" prefix match
    location = /api/login {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /api/register {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        limit_req zone=api burst=50 nodelay;
        limit_conn conn 50;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

