; ─── Shared settings: apply to EVERY environment ─────────────────────────
[env]
platform      = espressif32
board         = seeed_xiao_esp32c3
framework     = arduino
monitor_speed = 115200
build_flags   = -std=gnu++17

; Build the firmwares by default when you run a bare `pio run`.
[platformio]
default_envs = master, edge, hub

; ─── MASTER firmware (in the OBD port) ───────────────────────────────────
[env:master]
build_flags      = ${env.build_flags} -D ROLE_MASTER
; Compile ONLY src/master/*  (ignore the edge code + the old src/main.cpp)
build_src_filter = +<master/>
; NimBLE 1.x = compatible with the installed Arduino-ESP32 2.0.x core
lib_deps         = h2zero/NimBLE-Arduino@^1.4.2

; ─── EDGE firmware (front + back plates) ─────────────────────────────────
[env:edge]
build_flags      = ${env.build_flags} -D ROLE_EDGE
; Compile ONLY src/edge/*  (ignore the master code + the old src/main.cpp)
build_src_filter = +<edge/>
; ESP32Servo drives the plate servo (PWM on D9)
lib_deps         = madhephaestus/ESP32Servo@^1.1.1

; ─── HUB firmware (plate that also carries the master's BLE role) ────────
; Two-device product: the phone talks BLE to this plate, which drives its own
; servo AND answers the follower plate's ESP-NOW polls. The follower runs the
; unchanged edge firmware.
[env:hub]
build_flags      = ${env.build_flags} -D ROLE_HUB
build_src_filter = +<hub/>
lib_deps         =
  h2zero/NimBLE-Arduino@^1.4.2
  madhephaestus/ESP32Servo@^1.1.1

; ─── DEMO builds: the pair is compiled in, controls disabled ─────────────
; Guaranteed-working demo firmware — no live pairing, fixed BLE name, fast
; poll. Flash BOTH together:
;   pio run -e master_demo -t upload --upload-port <master>
;   pio run -e edge_demo   -t upload --upload-port <edge>
; MACs are hard-coded in the DEMO_LOCK block at the top of each main.cpp.
[env:master_demo]
build_flags      = ${env.build_flags} -D ROLE_MASTER -D DEMO_LOCK
build_src_filter = +<master/>
lib_deps         = h2zero/NimBLE-Arduino@^1.4.2

[env:edge_demo]
build_flags      = ${env.build_flags} -D ROLE_EDGE -D DEMO_LOCK
build_src_filter = +<edge/>
lib_deps         = madhephaestus/ESP32Servo@^1.1.1

; Locked two-device demo pair: flash hub_demo on the board whose MAC matches
; the edge's compiled-in DEMO_MASTER_MAC, and edge_demo on the plate whose MAC
; is the hub's DEMO_EDGE_MAC.
;   pio run -e hub_demo  -t upload --upload-port <hub plate>
;   pio run -e edge_demo -t upload --upload-port <follower plate>
[env:hub_demo]
build_flags      = ${env.build_flags} -D ROLE_HUB -D DEMO_LOCK
build_src_filter = +<hub/>
lib_deps         =
  h2zero/NimBLE-Arduino@^1.4.2
  madhephaestus/ESP32Servo@^1.1.1

; ─── PINSCAN (bench only) ────────────────────────────────────────────────
; Servo-finder: sweeps a 50 Hz servo signal on EVERY pad (D0..D10) at once.
[env:pinscan]
build_flags      = ${env.build_flags}
build_src_filter = +<pinscan/>

; ─── BATTERY TEST (bench only) ───────────────────────────────────────────
; Blinks the LED so you can SEE the board is alive on battery (no USB needed)
; and prints battery voltage over serial. Flash with:  pio run -e batt -t upload
[env:batt]
build_flags      = ${env.build_flags}
build_src_filter = +<batt/>
