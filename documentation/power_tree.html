<title>L Flip Power Tree</title>
<style>
  :root{ --ink:#1c2734; --paper:#ffffff; }
  *{box-sizing:border-box;margin:0}
  html,body{background:var(--paper);color:var(--ink)}
  .page{width:210mm;min-height:297mm;margin:0 auto;background:var(--paper);
        padding:42mm 10mm 40mm;display:flex;align-items:center;justify-content:center;
        -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page svg{display:block;width:100%;height:auto}
  @media print{ .page{width:auto;min-height:auto} @page{size:A4 portrait;margin:0} }
</style>

<div class="page">
  <svg viewBox="0 0 800 640" role="img" aria-label="The power design of the L Flip plates: real hardware states, current firmware behaviour, and the planned battery measures, ending in the expected result">
    <defs>
      <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L8,4 L0,8 z" fill="#1c2734"/>
      </marker>
    </defs>
    <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#1c2734">

      <!-- power truth row -->
      <rect x="8" y="8" width="170" height="44" rx="3" fill="#1c2734"/>
      <text x="93" y="26" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">NO CELL &#183; 0 mA</text>
      <text x="93" y="41" text-anchor="middle" fill="#ffffff" font-size="8.8">the only true &#8220;off&#8221;</text>

      <line x1="178" y1="30" x2="196" y2="30" stroke="#1c2734" stroke-width="1.2" marker-end="url(#arr)"/>
      <rect x="198" y="8" width="250" height="44" rx="3" fill="#f2f4f7" stroke="#1c2734" stroke-width="1.4"/>
      <text x="323" y="26" text-anchor="middle" font-weight="600" font-size="10">CELL IN &#183; always running</text>
      <text x="323" y="41" text-anchor="middle" font-size="8.8">no switch &#8212; BAT pads power ESP + servo</text>

      <line x1="448" y1="30" x2="466" y2="30" stroke="#1c2734" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
      <rect x="468" y="8" width="324" height="44" rx="3" fill="#f2f4f7" stroke="#1c2734" stroke-width="1.2"/>
      <text x="630" y="26" text-anchor="middle" font-weight="600" font-size="10">USB-C IN &#183; run + charge</text>
      <text x="630" y="41" text-anchor="middle" font-size="8.8">onboard charger tops the cell &#8212; charge like a phone</text>

      <!-- ship gate -->
      <line x1="400" y1="52" x2="400" y2="72" stroke="#1c2734" stroke-width="1.2" marker-end="url(#arr)"/>
      <rect x="300" y="74" width="200" height="26" rx="3" fill="#ffffff" stroke="#1c2734" stroke-width="1.4"/>
      <text x="400" y="91" text-anchor="middle" font-weight="600">Commissioned yet?</text>

      <rect x="556" y="66" width="236" height="62" rx="3" fill="#1c2734"/>
      <text x="674" y="82" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">SHIP MODE &#183; deep sleep (&#181;A)</text>
      <text x="674" y="97" text-anchor="middle" fill="#ffffff" font-size="9.5">wakes every 8 s: USB seen? button held?</text>
      <text x="674" y="111" text-anchor="middle" fill="#ffffff" font-size="9.5">no timeout &#8212; asleep until first plug-in</text>
      <line x1="500" y1="87" x2="550" y2="87" stroke="#1c2734" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="525" y="81" text-anchor="middle" font-size="9" fill="#5b6472">no</text>
      <path d="M 616 128 C 586 150 540 150 520 150" fill="none" stroke="#1c2734" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="632" y="146" font-size="9" fill="#5b6472">first plug-in &#8594; one-way door</text>

      <!-- boot -->
      <line x1="400" y1="100" x2="400" y2="134" stroke="#1c2734" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="408" y="120" font-size="9" fill="#5b6472">yes</text>
      <rect x="258" y="136" width="284" height="26" rx="3" fill="#f2f4f7" stroke="#1c2734" stroke-width="1.2"/>
      <text x="400" y="153" text-anchor="middle">Boot &#183; 1.5 s rail settle &#183; servo unpowered</text>

      <!-- guard sidebar -->
      <rect x="8" y="74" width="200" height="128" rx="3" fill="#ffffff" stroke="#9c3535" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="18" y="90" font-size="8.5" fill="#9c3535" font-weight="700" letter-spacing="1">RUNS ALONGSIDE EVERYTHING</text>
      <text x="18" y="106" font-size="9.5" font-weight="600">Battery guard, every 5 s</text>
      <text x="18" y="120" font-size="9">V&lt;3.20 twice &#8594; PARK: deep sleep</text>
      <text x="18" y="133" font-size="9">until power-cycled &#183; quiet 1 s</text>
      <text x="18" y="146" font-size="9">after servo moves (sag &#8800; flat)</text>
      <text x="18" y="163" font-size="9" fill="#9c3535">A0 divider not built &#8594; guard is</text>
      <text x="18" y="176" font-size="9" fill="#9c3535">inert; the cells&#8217; protection ICs</text>
      <text x="18" y="189" font-size="9" fill="#9c3535">are the real backstop today</text>

      <!-- which board -->
      <line x1="400" y1="162" x2="400" y2="192" stroke="#1c2734" stroke-width="1.2" marker-end="url(#arr)"/>
      <rect x="322" y="194" width="156" height="26" rx="3" fill="#ffffff" stroke="#1c2734" stroke-width="1.4"/>
      <text x="400" y="211" text-anchor="middle" font-weight="600">Which board?</text>
      <path d="M 322 207 L 236 207 L 236 236" fill="none" stroke="#1c2734" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="240" y="231" font-size="9" fill="#5b6472">follower plate</text>
      <path d="M 478 207 L 584 207 L 584 236" fill="none" stroke="#1c2734" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="590" y="231" font-size="9" fill="#5b6472">hub plate</text>

      <!-- follower lane -->
      <rect x="126" y="238" width="220" height="26" rx="3" fill="#ffffff" stroke="#1c2734" stroke-width="1.4"/>
      <text x="236" y="255" text-anchor="middle" font-weight="600">Paired to a hub before?</text>

      <rect x="8" y="284" width="104" height="58" rx="3" fill="#f2f4f7" stroke="#1c2734" stroke-width="1.2"/>
      <text x="60" y="300" text-anchor="middle" font-size="9.5" font-weight="600">PAIRING</text>
      <text x="60" y="314" text-anchor="middle" font-size="9">broadcast +</text>
      <text x="60" y="327" text-anchor="middle" font-size="9">blink until a</text>
      <text x="60" y="340" text-anchor="middle" font-size="9">hub adopts it</text>
      <path d="M 126 251 L 60 251 L 60 280" fill="none" stroke="#1c2734" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="88" y="246" text-anchor="middle" font-size="9" fill="#5b6472">no</text>
      <path d="M 112 322 C 150 344 180 362 198 378" fill="none" stroke="#1c2734" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="112" y="362" font-size="9" fill="#5b6472">adopted</text>

      <line x1="236" y1="264" x2="236" y2="284" stroke="#1c2734" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="243" y="279" font-size="9" fill="#5b6472">yes</text>
      <rect x="126" y="286" width="220" height="40" rx="3" fill="#f2f4f7" stroke="#1c2734" stroke-width="1.2"/>
      <text x="236" y="302" text-anchor="middle" font-weight="600">SEEK saved hub &#183; never quits</text>
      <text x="236" y="317" text-anchor="middle" font-size="9.5">backoff 500 ms &#215;2 &#8594; 60 s cap</text>
      <rect x="292" y="278" width="40" height="12" rx="2" fill="#e2f0e6"/>
      <text x="312" y="287.5" text-anchor="middle" font-size="7.5" fill="#256b3c" font-weight="700">BUILT</text>

      <line x1="236" y1="326" x2="236" y2="378" stroke="#1c2734" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="228" y="356" font-size="9" fill="#5b6472" text-anchor="end">hub answers</text>
      <line x1="312" y1="378" x2="312" y2="330" stroke="#8a6100" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
      <text x="306" y="344" font-size="8" fill="#8a6100" text-anchor="end">5 silent polls</text>
      <text x="306" y="354" font-size="8" fill="#8a6100" text-anchor="end">&#8594; seek again</text>
      <rect x="254" y="359" width="52" height="12" rx="2" fill="#faf0d2"/>
      <text x="280" y="368.5" text-anchor="middle" font-size="7.5" fill="#8a6100" font-weight="700">TO BUILD</text>

      <rect x="126" y="380" width="220" height="26" rx="3" fill="#f2f4f7" stroke="#1c2734" stroke-width="1.2"/>
      <text x="236" y="397" text-anchor="middle" font-weight="600">ONLINE &#183; polls at hub&#8217;s pace</text>

      <line x1="236" y1="406" x2="236" y2="426" stroke="#1c2734" stroke-width="1.2" marker-end="url(#arr)"/>
      <rect x="112" y="428" width="88" height="22" rx="2" fill="#ffffff" stroke="#d7dbe1"/>
      <text x="156" y="442.5" text-anchor="middle" font-size="9">phone: 300 ms</text>
      <rect x="206" y="428" width="64" height="22" rx="2" fill="#ffffff" stroke="#d7dbe1"/>
      <text x="238" y="442.5" text-anchor="middle" font-size="9">idle: 3 s</text>
      <rect x="276" y="428" width="94" height="22" rx="2" fill="#ffffff" stroke="#d7dbe1"/>
      <text x="323" y="442.5" text-anchor="middle" font-size="9">moved: 250 ms</text>

      <line x1="238" y1="450" x2="238" y2="470" stroke="#1c2734" stroke-width="1.2" marker-end="url(#arr)"/>
      <rect x="96" y="472" width="290" height="74" rx="3" fill="#faf0d2" stroke="#1c2734" stroke-width="1.4"/>
      <text x="108" y="489" font-weight="700" font-size="9.5">THE battery measure (follower)</text>
      <rect x="322" y="479" width="52" height="12" rx="2" fill="#ffffff"/>
      <text x="348" y="488.5" text-anchor="middle" font-size="7.5" fill="#8a6100" font-weight="700">TO BUILD</text>
      <text x="108" y="504" font-size="9">no phone for 10 min &#8594; poll every 30 s,</text>
      <text x="108" y="517" font-size="9">napping between polls; snaps back to</text>
      <text x="108" y="530" font-size="9">300 ms as soon as the hub sees a phone</text>
      <text x="108" y="542" font-size="8.5" fill="#5b6472">price: first flip &#8804;30 s late after a long idle</text>

      <!-- hub lane -->
      <rect x="474" y="238" width="220" height="40" rx="3" fill="#f2f4f7" stroke="#1c2734" stroke-width="1.2"/>
      <text x="584" y="254" text-anchor="middle" font-weight="600">ADVERTISE BLE &#183; always on</text>
      <text x="584" y="269" text-anchor="middle" font-size="8.8" fill="#5b6472">never sleeps &#8212; it is the phone&#8217;s anchor</text>
      <rect x="700" y="230" width="40" height="12" rx="2" fill="#e2f0e6"/>
      <text x="720" y="239.5" text-anchor="middle" font-size="7.5" fill="#256b3c" font-weight="700">BUILT</text>

      <line x1="584" y1="278" x2="584" y2="298" stroke="#1c2734" stroke-width="1.2" marker-end="url(#arr)"/>
      <rect x="474" y="300" width="220" height="26" rx="3" fill="#ffffff" stroke="#1c2734" stroke-width="1.4"/>
      <text x="584" y="317" text-anchor="middle" font-weight="600">Phone connected?</text>

      <path d="M 668 326 L 700 326 L 700 348" fill="none" stroke="#1c2734" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="706" y="342" font-size="9" fill="#5b6472">yes</text>
      <rect x="620" y="350" width="168" height="54" rx="3" fill="#f2f4f7" stroke="#1c2734" stroke-width="1.2"/>
      <text x="704" y="366" text-anchor="middle" font-weight="600" font-size="10">TRIP</text>
      <text x="704" y="380" text-anchor="middle" font-size="9">300 ms pace &#183; status 1/s</text>
      <text x="704" y="393" text-anchor="middle" font-size="9">flips its own servo</text>

      <path d="M 500 326 L 470 326 L 470 348" fill="none" stroke="#1c2734" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="450" y="342" font-size="9" fill="#5b6472">no</text>
      <rect x="396" y="350" width="180" height="80" rx="3" fill="#f7c600" stroke="#1c2734" stroke-width="1.6"/>
      <text x="486" y="367" text-anchor="middle" font-weight="700" font-size="10.5">IDLE &#183; the main drain</text>
      <text x="486" y="381" text-anchor="middle" font-size="9">radios at full power</text>
      <rect x="460" y="388" width="52" height="12" rx="2" fill="#ffffff"/>
      <text x="486" y="397.5" text-anchor="middle" font-size="7.5" fill="#8a6100" font-weight="700">TO BUILD</text>
      <text x="486" y="412" text-anchor="middle" font-size="8.8">after 10 min: slower adverts</text>
      <text x="486" y="424" text-anchor="middle" font-size="8.8">(connecting gets ~1 s slower)</text>

      <!-- servo box -->
      <rect x="620" y="472" width="172" height="66" rx="3" fill="#f2f4f7" stroke="#1c2734" stroke-width="1.2"/>
      <text x="630" y="488" font-size="9.5" font-weight="600">SERVO &#183; solved</text>
      <rect x="726" y="479" width="40" height="12" rx="2" fill="#e2f0e6"/>
      <text x="746" y="488.5" text-anchor="middle" font-size="7.5" fill="#256b3c" font-weight="700">BUILT</text>
      <text x="630" y="503" font-size="9">powered only for a ~2 s</text>
      <text x="630" y="516" font-size="9">move; PWM low at rest; shares</text>
      <text x="630" y="529" font-size="9">the rail &#8212; a move sags it</text>

      <!-- result band -->
      <line x1="486" y1="430" x2="486" y2="552" stroke="#1c2734" stroke-width="1.4" marker-end="url(#arr)"/>
      <line x1="241" y1="546" x2="241" y2="552" stroke="#1c2734" stroke-width="1.4" marker-end="url(#arr)"/>
      <rect x="8" y="554" width="784" height="56" rx="3" fill="#fdf3c4" stroke="#1c2734" stroke-width="1.6"/>
      <text x="400" y="573" text-anchor="middle" font-weight="700" font-size="10">RESULT &#183; demo always runs full-speed (a phone is connected) &#183; parked = low draw &#183; charge like a phone</text>
      <text x="400" y="589" text-anchor="middle" font-size="9">est. idle life ~1&#8211;2 days today &#8594; ~4&#8211;7 days with the naps &#183; flat cell: its protection IC cuts out,</text>
      <text x="400" y="602" text-anchor="middle" font-size="9">recharge over USB-C &#8212; pairing + calibration survive in flash, nothing to set up again</text>

      <!-- legend -->
      <g font-size="8.5" fill="#5b6472">
        <rect x="228" y="626" width="8" height="8" fill="#ffffff" stroke="#1c2734"/><text x="240" y="633.5">decision</text>
        <rect x="298" y="626" width="8" height="8" fill="#f2f4f7" stroke="#1c2734"/><text x="310" y="633.5">running</text>
        <rect x="364" y="626" width="8" height="8" fill="#1c2734"/><text x="376" y="633.5">asleep/off</text>
        <text x="446" y="633.5" fill="#256b3c" font-weight="700">BUILT</text><text x="480" y="633.5">= in firmware now</text>
        <text x="586" y="633.5" fill="#8a6100" font-weight="700">TO BUILD</text><text x="638" y="633.5">= the plan, not yet code</text>
      </g>
    </g>
  </svg>
</div>
