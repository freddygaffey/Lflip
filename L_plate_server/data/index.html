<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L Plate Logger</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        #back_btn {
            display: block;
            width: 80%;
            max-width: 400px;
            margin: 0 auto 20px;
            padding: 10px;
            background-color: #ffe0b2;
            border: 1px solid #fb8c00;
            font-size: 16px;
            text-decoration: none;
            color: black;
        }
        .odo_section {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .odo_section input {
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            width: 200px;
        }
        .odo_section button {
            padding: 10px 16px;
            font-size: 14px;
            border: 1px solid #ccc;
            background: #f5f5f5;
            cursor: pointer;
        }
        .svd_section {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .svd_section h2 {
            font-size: 16px;
            margin-bottom: 10px;
        }
        #sdv_list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }
        #sdv_list button {
            padding: 12px;
            font-size: 16px;
            background-color: #bbdefb;
            border: 1px solid #90caf9;
            cursor: pointer;
        }
        #sdv_list button:hover {
            background-color: #90caf9;
        }
        #sdv_list button.selected {
            background-color: #90caf9;
            border: 2px solid #1976d2;
        }
        #sdv_list button.unselected {
            background-color: #e0e0e0;
            border: 1px solid #bdbdbd;
        }
        #go_to_svd_page {
            padding: 10px 20px;
            font-size: 14px;
            background-color: #bbdefb;
            border: 1px solid #90caf9;
            cursor: pointer;
        }
        #start {
            display: block;
            width: 80%;
            max-width: 400px;
            margin: 20px auto;
            padding: 16px;
            font-size: 20px;
            background-color: #c8e6c9;
            border: 1px solid #81c784;
            cursor: pointer;
        }
        #start:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #stop {
            display: none;
        }
        #add_wifi_btn {
            display: block;
            width: 80%;
            max-width: 400px;
            margin: 20px auto;
            padding: 12px;
            font-size: 16px;
            background: #f5f5f5;
            border: 1px solid #ccc;
            cursor: pointer;
            text-decoration: none;
            color: black;
        }
    </style>
</head>
<body>
    <a id="back_btn" href="/">Back to dashboard</a>
    <div class="odo_section">
        <input id="last_3d_odo" placeholder="Enter last 3 digits (0-999 km)" type="number" min="0" max="999">
        <button id="odo_submit">Send</button>
    </div>
    <div class="svd_section">
        <h2>supervising driver</h2>
        <div id="sdv_list"></div>
        <button id="go_to_svd_page">SD Other/add</button>
    </div>
    <button id="start">Start</button>
    <button id="stop" disabled>stop</button>
    <a id="add_wifi_btn" href="/add_wifi">Add Wi-Fi network</a>
    <script>
        fetch("/api/time/set?time="+ Math.floor(Date.now() /1000), {method: "POST"});
        let selectedSvd = null;

        function updateButtons() {
            fetch("/api/state")
                .then(res => res.json())
                .then(data => {
                    document.getElementById("start").disabled = (data.state === "logging");
                });
        }

        document.addEventListener("DOMContentLoaded",() => {
            updateButtons();

            fetch("/api/svd/get", {method: "POST"})
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById("sdv_list");
                const num_of_but = 3;
                const driver = (data.SVD || [])
                .sort((a,b) => b.last_used - a.last_used)
                .slice(0,num_of_but);
                driver.forEach(svd => {
                    const btn = document.createElement("button");
                    btn.textContent = svd.nick_name;
                    btn.onclick = () => {
                        selectedSvd = svd.hash_id;
                        list.querySelectorAll("button").forEach(b => {
                            b.classList.remove("selected");
                            b.classList.add("unselected");
                        });
                        btn.classList.remove("unselected");
                        btn.classList.add("selected");
                        fetch("/api/svd/set?hash_id="+svd.hash_id, {method: "POST"});
                    };
                list.append(btn);
                });
            })
        })

        document.getElementById("odo_submit").addEventListener("click", () => {
            let val = document.getElementById("last_3d_odo").value;
            if (!val) {
                alert("Please enter ODO value");
                return;
            }

            // Validate: must be numeric
            if (!/^\d+$/.test(val)) {
                alert("ODO must be a number");
                return;
            }

            let km = parseInt(val);

            // Validate: must be 0-999
            if (km < 0 || km > 999) {
                alert("ODO must be between 0 and 999 km");
                return;
            }

            let meters = km * 1000;
            fetch("/api/odo/set?odo=" + meters, {method: "POST"})
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert("ODO updated to " + data.new_odo_km + " km");
                    } else {
                        alert("Error: " + (data.error || "unknown error"));
                    }
                })
                .catch(err => {
                    alert("Network error: " + err);
                });
        });

        document.getElementById("start").addEventListener("click", () => {
            if (!selectedSvd) { alert("Select a supervising driver first"); return; }
            fetch("/api/start?hash_id=" + selectedSvd, {method: "POST"})
                .then(() => {window.location.href = "/stop";});
        });

        document.getElementById("go_to_svd_page").addEventListener("click", function () {
           window.location.href = "/svd"
        })
    </script>
</body>
</html>
