<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add WiFi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 20px;
        }
        input {
            display: block;
            width: 80%;
            max-width: 400px;
            margin: 10px auto;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
        }
        #wifi_ssid_butt {
            display: block;
            width: 80%;
            max-width: 400px;
            margin: 15px auto;
            padding: 12px;
            font-size: 16px;
            background: #f5f5f5;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        .warning {
            max-width: 400px;
            margin: 20px auto;
            text-align: left;
            font-size: 14px;
            line-height: 1.5;
        }
        .warning strong {
            font-size: 18px;
        }
        a {
            display: block;
            width: 80%;
            max-width: 400px;
            margin: 20px auto;
            padding: 10px;
            background-color: #ffe0b2;
            border: 1px solid #fb8c00;
            font-size: 16px;
            text-decoration: none;
            color: black;
        }
    </style>
</head>
<body>
    <h1>Add a wifi network</h1>
    <input id="ssid" type="text" placeholder="SSID (name)">
    <input id="pwd" type="password" placeholder="Password">
    <button id="wifi_ssid_butt">Add network</button>

    <p class="warning"><strong>IMPORTANT</strong><br><br>
    Please only add a network that is secure because there is no
    authentication on the locally hosted website and anyone on this
    network can access these pages</p>

    <a href="/">Back to dashboard</a>

    <script>
        document.getElementById("wifi_ssid_butt").addEventListener("click",async function () {
           let ssid = document.getElementById("ssid").value;
           let pwd = document.getElementById("pwd").value;

           let response = await fetch("/api/wifi/add?ssid="+ssid+"&pwd="+pwd);

           alert("the network is added");
        })
    </script>
</body>
</html>
